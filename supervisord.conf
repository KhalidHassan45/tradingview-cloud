[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN)s -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
priority=20
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; TradingView Desktop. CDP listens on 127.0.0.1:9222 only — never published.
[program:tradingview]
command=/opt/TradingView/tradingview --remote-debugging-port=%(ENV_TV_CDP_PORT)s --remote-debugging-address=127.0.0.1 --no-sandbox --disable-gpu --disable-dev-shm-usage
priority=30
startsecs=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Composio endpoint: token + allow-list (ui_*, batch_run, tv_update, tv_launch are never exposed)
[program:gateway]
command=/usr/local/bin/node /opt/app/gateway/gateway.mjs
directory=/opt/app/gateway
priority=40
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One-time login screen. Off unless ENABLE_VNC=1 (entrypoint starts these two on demand).
[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport 5900 -localhost -forever -shared -rfbauth /tmp/vncpass -quiet
priority=50
autostart=false
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=60
autostart=false
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true
